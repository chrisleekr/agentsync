services:
  vault-init:
    image: alpine/git:latest
    volumes:
      - vault-data:/vault
    user: "0:0"
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -e
        if [ ! -d /vault/repo.git ]; then
          git init --bare /vault/repo.git
          git -C /vault/repo.git symbolic-ref HEAD refs/heads/main
        fi
        chown -R 1001:1001 /vault
        echo "vault-init: ready at /vault/repo.git"

  machine:
    build:
      context: ../..
      dockerfile: docker/e2e/Dockerfile.machine
    depends_on:
      vault-init:
        condition: service_completed_successfully
    volumes:
      - vault-data:/vault
    environment:
      VAULT_URL: "file:///vault/repo.git"
      HOME: /home/agent
    # Default CMD runs the smoke scenario. Per-scenario CI runs override CMD
    # via `docker compose run --rm machine /home/agent/scenarios/$NAME.sh`.

  # Scenario 17 (git:// protocol). Brought up only when the `git-daemon`
  # profile is selected so default `compose up` stays cheap. Modern git refuses
  # to run `git daemon` as root unless --user is set; we drop to the alpine
  # `git` user (uid 1000 in alpine/git) for the listener.
  git-daemon:
    image: alpine/git:latest
    profiles: ["git-daemon"]
    volumes:
      - vault-data:/vault
    user: "1000:1000"
    expose: ["9418"]
    command:
      - sh
      - -c
      - |
        set -e
        git daemon \
          --reuseaddr \
          --base-path=/vault \
          --export-all \
          --enable=receive-pack \
          --verbose \
          /vault

volumes:
  vault-data:
