name: Docs

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - ".github/workflows/docs.yml"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: docs-${{ github.ref }}
  # PR builds can be cancelled when a newer commit lands; deploy runs
  # on main must not be cancelled mid-flight to avoid a half-published site.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.x"
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - name: Install dependencies
        run: pip install -r docs/requirements.txt

      - name: Build (strict)
        run: mkdocs build --strict

      - name: Deploy to GitHub Pages
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_PAGES_TOKEN: ${{ github.token }}
        run: |
          git config --local --replace-all credential.helper ""
          git config --local --add credential.helper \
            "!f() { echo username=x-access-token; echo password=\$GH_PAGES_TOKEN; }; f"
          trap 'git config --local --unset-all credential.helper' EXIT
          mkdocs gh-deploy --force
