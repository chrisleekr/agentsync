name: release-please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ secrets.RELEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish-package:
    name: Publish npm package
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.9"

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Cache bun dependencies
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Upgrade npm
        run: npm install --global npm@11.5.1

      - name: Build package
        run: bun run build:package

      - name: Publish package
        run: npm publish --provenance --access public

  build-and-upload:
    name: Build and upload release artifacts
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: agentsync-linux-x64
          - os: ubuntu-latest
            target: agentsync-linux-arm64
            bun_target: bun-linux-arm64
          - os: macos-latest
            target: agentsync-macos-arm64
          - os: macos-latest
            target: agentsync-macos-x64
            bun_target: bun-darwin-x64
          - os: ubuntu-latest
            target: agentsync-windows-x64.exe
            bun_target: bun-windows-x64
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.9"

      # Pin Node/npm via .nvmrc so the cross-target `npm install --force
      # --os --cpu` below is reproducible across runner image refreshes.
      # Matches the pinning the publish-package job already uses.
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Cache bun dependencies
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Cross-compiling embeds the target's @opentui/core-<os>-<cpu> native
      # module. bun install only fetches the host's optional dep, so we
      # explicitly install the target's variant. --force bypasses os/cpu
      # skip filtering; --no-save keeps bun.lock untouched.
      - name: Install target-platform OpenTUI native module
        if: matrix.bun_target
        env:
          BUN_TARGET: ${{ matrix.bun_target }}
        run: |
          set -euo pipefail
          case "$BUN_TARGET" in
            bun-windows-x64)    PKG=@opentui/core-win32-x64;    OS=win32;  CPU=x64 ;;
            bun-windows-arm64)  PKG=@opentui/core-win32-arm64;  OS=win32;  CPU=arm64 ;;
            bun-linux-x64)      PKG=@opentui/core-linux-x64;    OS=linux;  CPU=x64 ;;
            bun-linux-arm64)    PKG=@opentui/core-linux-arm64;  OS=linux;  CPU=arm64 ;;
            bun-darwin-x64)     PKG=@opentui/core-darwin-x64;   OS=darwin; CPU=x64 ;;
            bun-darwin-arm64)   PKG=@opentui/core-darwin-arm64; OS=darwin; CPU=arm64 ;;
            *) echo "Unknown bun_target: $BUN_TARGET" >&2; exit 1 ;;
          esac
          CORE_PKG=node_modules/@opentui/core/package.json
          if [ ! -f "$CORE_PKG" ]; then
            echo "Expected @opentui/core hoisted at $CORE_PKG; install layout changed" >&2
            exit 1
          fi
          VERSION=$(jq -r .version "$CORE_PKG")
          echo "Installing $PKG@$VERSION for $OS/$CPU"
          npm install --no-save --force --os="$OS" --cpu="$CPU" "${PKG}@${VERSION}"
          # Loud failure if the registry returned a different version, instead of
          # the later "Could not resolve" error from bun build at compile time.
          INSTALLED="node_modules/${PKG}/package.json"
          if [ ! -f "$INSTALLED" ]; then
            echo "Expected $INSTALLED after install; native package missing" >&2
            exit 1
          fi
          INSTALLED_VERSION=$(jq -r .version "$INSTALLED")
          if [ "$INSTALLED_VERSION" != "$VERSION" ]; then
            echo "Version mismatch: host @opentui/core=$VERSION, target $PKG=$INSTALLED_VERSION" >&2
            exit 1
          fi

      - name: Build binary
        run: bun build --compile ${{ matrix.bun_target && format('--target {0}', matrix.bun_target) || '' }} src/cli.ts --outfile dist/${{ matrix.target }}

      - name: Generate SHA256 checksum
        working-directory: dist
        run: shasum -a 256 ${{ matrix.target }} > ${{ matrix.target }}.sha256

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: dist/${{ matrix.target }}

      - name: Upload release artifact
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: gh release upload ${{ needs.release-please.outputs.tag_name }} dist/${{ matrix.target }} dist/${{ matrix.target }}.sha256 --clobber

  # No Sigstore attestation on this job: SHA256SUMS is a re-publication of
  # the already-attested per-binary hashes. The trust root is the per-binary
  # attestation (matrix.target). Verification chain: provenance proves binary
  # → binary hash matches manifest line → safe. Attesting the manifest itself
  # would add noise without raising the floor.
  aggregate-checksums:
    name: Aggregate SHA256SUMS manifest
    needs: [release-please, build-and-upload]
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download per-binary checksums
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
        run: |
          mkdir -p checksums
          gh release download "$TAG_NAME" \
            --pattern '*.sha256' \
            --dir checksums \
            --repo "$GITHUB_REPOSITORY"

      - name: Build aggregate SHA256SUMS
        working-directory: checksums
        run: cat *.sha256 | sort > SHA256SUMS

      - name: Upload SHA256SUMS to release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
        run: gh release upload "$TAG_NAME" checksums/SHA256SUMS --clobber
