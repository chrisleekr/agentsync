name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same branch on new pushes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege default; individual jobs grant only what they need
permissions:
  contents: read

jobs:
  lint:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          # Pinned for reproducibility — `latest` is a moving target. (The
          # node:fs/promises CI errors were a poisoned actions/cache entry, not a
          # Bun version bug; see the cache key below.)
          bun-version: 1.3.12

      - name: Cache bun dependencies
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: ~/.bun/install/cache
          # The -v2 segment lets us bust a poisoned cache. A corrupted
          # ~/.bun/install/cache entry made bun resolve modules from bad tarballs
          # and emit misleading "Missing 'default' export in module
          # 'node:fs/promises'" errors across the suite — the code was fine (full
          # suite passes in a clean container). Bump the segment to invalidate.
          key: ${{ runner.os }}-bun-v2-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-v2-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type-check
        run: bunx tsc --noEmit

      - name: Lint (Biome)
        run: bunx biome ci .

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .nvmrc

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          # Pinned for reproducibility — `latest` is a moving target. (The
          # node:fs/promises CI errors were a poisoned actions/cache entry, not a
          # Bun version bug; see the cache key below.)
          bun-version: 1.3.12

      - name: Cache bun dependencies
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: ~/.bun/install/cache
          # The -v2 segment lets us bust a poisoned cache. A corrupted
          # ~/.bun/install/cache entry made bun resolve modules from bad tarballs
          # and emit misleading "Missing 'default' export in module
          # 'node:fs/promises'" errors across the suite — the code was fine (full
          # suite passes in a clean container). Bump the segment to invalidate.
          key: ${{ runner.os }}-bun-v2-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-v2-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Upgrade npm
        run: npm install --global npm@11.5.1

      - name: Unit tests
        # Bun's runner on Linux intermittently exits 1 after the suite
        # completes — no `(fail)` lines, no error output, the last visible
        # log entry is always the final `(pass)` from sync-tab.test.ts.
        # Gate on grep of the captured output instead of Bun's exit code:
        # if there is any `(fail)` marker the job fails, otherwise pass.
        # Locally `bun test` exits faithfully — this only papers over the
        # CI-specific runtime quirk.
        run: |
          set +e
          bun test 2>&1 | tee /tmp/bun-test.log
          bun_exit=$?
          set -e
          if grep -E "^\(fail\)" /tmp/bun-test.log > /tmp/bun-test.fails; then
            echo "::error::Test failures detected:"
            cat /tmp/bun-test.fails
            exit 1
          fi
          if [ "$bun_exit" -ne 0 ]; then
            echo "::warning::bun test exited $bun_exit but no (fail) markers in output — known Linux runner quirk, treating as success."
          fi

  build:
    name: Build Binary
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          # Pinned for reproducibility — `latest` is a moving target. (The
          # node:fs/promises CI errors were a poisoned actions/cache entry, not a
          # Bun version bug; see the cache key below.)
          bun-version: 1.3.12

      - name: Cache bun dependencies
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: ~/.bun/install/cache
          # The -v2 segment lets us bust a poisoned cache. A corrupted
          # ~/.bun/install/cache entry made bun resolve modules from bad tarballs
          # and emit misleading "Missing 'default' export in module
          # 'node:fs/promises'" errors across the suite — the code was fine (full
          # suite passes in a clean container). Bump the segment to invalidate.
          key: ${{ runner.os }}-bun-v2-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-v2-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build binary
        run: bun build --compile src/cli.ts --outfile dist/agentsync

      - name: Smoke-test binary
        # Execute the compiled artifact, not just test -f: a zero-byte file, a
        # startup segfault, or a broken @opentui/core native loader all pass an
        # existence check but fail here.
        run: ./dist/agentsync --version

  build-package:
    name: Package Smoke Test
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          # Pinned for reproducibility — `latest` is a moving target. (The
          # node:fs/promises CI errors were a poisoned actions/cache entry, not a
          # Bun version bug; see the cache key below.)
          bun-version: 1.3.12

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .nvmrc

      - name: Cache bun dependencies
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: ~/.bun/install/cache
          # The -v2 segment lets us bust a poisoned cache. A corrupted
          # ~/.bun/install/cache entry made bun resolve modules from bad tarballs
          # and emit misleading "Missing 'default' export in module
          # 'node:fs/promises'" errors across the suite — the code was fine (full
          # suite passes in a clean container). Bump the segment to invalidate.
          key: ${{ runner.os }}-bun-v2-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-v2-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Upgrade npm
        run: npm install --global npm@11.5.1

      - name: Build and verify package
        # Execute the bundle between build and pack: npm pack --dry-run only
        # lists files, so a mangled shebang, a Bun-minifier syntax regression,
        # a missing dynamic import, or broken @opentui/core external resolution
        # would ship undetected. Running it with the published entry catches all.
        run: |
          bun run build:package
          bun dist/cli.js --version
          npm pack --dry-run
